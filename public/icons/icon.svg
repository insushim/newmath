<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C5CE7"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D2D3"/>
      <stop offset="100%" style="stop-color:#55efc4"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Abacus frame -->
  <rect x="100" y="100" width="312" height="312" rx="24" fill="none" stroke="white" stroke-width="12" opacity="0.9"/>
  <!-- Horizontal bars -->
  <line x1="100" y1="175" x2="412" y2="175" stroke="white" stroke-width="6" opacity="0.4"/>
  <line x1="100" y1="250" x2="412" y2="250" stroke="white" stroke-width="6" opacity="0.4"/>
  <line x1="100" y1="325" x2="412" y2="325" stroke="white" stroke-width="6" opacity="0.4"/>
  <!-- Beads row 1 -->
  <circle cx="170" cy="175" r="22" fill="url(#accent)"/>
  <circle cx="220" cy="175" r="22" fill="url(#accent)"/>
  <circle cx="270" cy="175" r="22" fill="white" opacity="0.3"/>
  <circle cx="320" cy="175" r="22" fill="white" opacity="0.3"/>
  <circle cx="370" cy="175" r="22" fill="white" opacity="0.3"/>
  <!-- Beads row 2 -->
  <circle cx="170" cy="250" r="22" fill="#FDCB6E"/>
  <circle cx="220" cy="250" r="22" fill="#FDCB6E"/>
  <circle cx="270" cy="250" r="22" fill="#FDCB6E"/>
  <circle cx="320" cy="250" r="22" fill="white" opacity="0.3"/>
  <circle cx="370" cy="250" r="22" fill="white" opacity="0.3"/>
  <!-- Beads row 3 -->
  <circle cx="170" cy="325" r="22" fill="#FF6B6B"/>
  <circle cx="220" cy="325" r="22" fill="white" opacity="0.3"/>
  <circle cx="270" cy="325" r="22" fill="white" opacity="0.3"/>
  <circle cx="320" cy="325" r="22" fill="white" opacity="0.3"/>
  <circle cx="370" cy="325" r="22" fill="white" opacity="0.3"/>
  <!-- Plus symbol -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="white" opacity="0.8">+  -  x  ÷</text>
</svg>
