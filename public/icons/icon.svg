<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A78BFA"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>
  <!-- Stylized M shape using geometric lines -->
  <path d="M 140 360 L 140 180 L 210 280 L 256 200 L 302 280 L 372 180 L 372 360"
        fill="none" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  <!-- Small pi symbol -->
  <text x="256" y="430" text-anchor="middle" font-family="Georgia,serif" font-size="44" font-weight="normal" fill="white" opacity="0.5">π</text>
</svg>
