<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오프라인 - 매쓰버스</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Noto Sans KR', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #6C5CE7 0%, #a29bfe 100%); color: white; text-align: center; padding: 2rem; }
    .container { max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { opacity: 0.8; margin-bottom: 1.5rem; line-height: 1.6; }
    button { background: white; color: #6C5CE7; border: none; padding: 0.75rem 2rem; border-radius: 0.75rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>인터넷 연결이 필요해요</h1>
    <p>매쓰버스를 사용하려면 인터넷에 연결해주세요.<br>Wi-Fi나 모바일 데이터를 확인해보세요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
